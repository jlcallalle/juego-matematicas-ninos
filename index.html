<head>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'math-purple': '#7C3AED',
                        'math-pink': '#EC4899',
                        'math-yellow': '#F59E0B',
                        'math-green': '#10B981',
                        'math-blue': '#3B82F6',
                        'math-orange': '#F97316',
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },

                    }

            }
        }

    <!-- SOUND EFFECTS USANDO WEB AUDIO API -->
    <script>
        // Web Audio API para efectos de sonido sin dependencias externas
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    // Fanfarria simple
                    const notes = [400, 500, 600, 800];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        
                        noteOsc.frequency.setValueAtTime(freq, now + (idx * 0.1));
                        noteGain.gain.setValueAtTime(0.15, now + (idx * 0.1));
                        noteGain.gain.linearRampToValueAtTime(0.01, now + (idx * 0.1) + 0.2);
                        
                        noteOsc.start(now + (idx * 0.1));
                        noteOsc.stop(now + (idx * 0.1) + 0.2);
                    });
                }
            } catch (e) {
                console.log('Audio non-supported or blocked', e);
            }
        }
    </script>

    <!-- LÓGICA PRINCIPAL DEL JUEGO -->
    <script>
        // Configuración y Estado del Juego
        let selectedOp = 'add';
        let selectedLevel = 'easy';

        let currentQuestion = 0;
        const totalQuestions = 10;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let correctCount = 0;

        let num1 = 0;
        let num2 = 0;
        let currentOperator = '+';
        let correctAnswer = 0;
        let userInput = '';

        let timerSeconds = 30;
        let timerInterval = null;
        let isAnswerLocked = false;

        const praisePhrases = [
            "¡FANTÁSTICO!", "¡INCREÍBLE!", "¡EXCELENTE!", 
            "¡GENIAL!", "¡SÚPER BIEN!", "¡ERES UN MAGO!"
        ];

        // Inicialización
        window.onload = function() {
            selectOp('add');
            selectLevel('easy');
            setupKeyboardListener();
        };

        // Selección de Operación
        function selectOp(op) {
            playSound('click');
            selectedOp = op;
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-yellow-400', 'scale-105');
            });
            const selectedBtn = document.getElementById(`op-${op}`);
            selectedBtn.classList.add('ring-4', 'ring-yellow-400', 'scale-105');
        }

        // Selección de Nivel
        function selectLevel(lvl) {
            playSound('click');
            selectedLevel = lvl;
            document.querySelectorAll('.lvl-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'scale-105');
            });
            const selectedBtn = document.getElementById(`lvl-${lvl}`);
            selectedBtn.classList.add('ring-4', 'ring-indigo-500', 'scale-105');
        }

        // Cambiar entre Pantallas
        function showMenu() {
            playSound('click');
            clearInterval(timerInterval);
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
        }

        function startGame() {
            playSound('click');
            currentQuestion = 0;
            score = 0;
            streak = 0;
            maxStreak = 0;
            correctCount = 0;

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            updateStatsDisplay();
            nextQuestion();
        }

        // Generador de Preguntas
        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            currentQuestion++;
            userInput = '';
            isAnswerLocked = false;
            updateInputDisplay();

            // Ocultar badges de feedback
            document.getElementById('feedback-badge').classList.add('hidden');
            document.getElementById('error-badge').classList.add('hidden');

            // Actualizar barra de progreso
            document.getElementById('q-count').innerText = currentQuestion;
            const progressPercent = ((currentQuestion - 1) / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Determinar operador activo (si es mixto, elige uno al azar)
            let op = selectedOp;
            if (op === 'mix') {
                const ops = ['add', 'sub', 'mul', 'div'];
                op = ops[Math.floor(Math.random() * ops.length)];
            }

            // Generar números según nivel y operación
            generateNumbers(op, selectedLevel);

            // Reiniciar temporizador por pregunta
            resetTimer();
        }

        function generateNumbers(op, level) {
            let maxNum, minNum;

            if (level === 'easy') {
                maxNum = (op === 'mul' || op === 'div') ? 5 : 15;
                minNum = 1;
            } else if (level === 'medium') {
                maxNum = (op === 'mul' || op === 'div') ? 10 : 50;
                minNum = 2;
            } else { // Hard
                maxNum = (op === 'mul' || op === 'div') ? 12 : 100;
                minNum = 5;
            }

            if (op === 'add') {
                num1 = Math.floor(Math.random() * maxNum) + minNum;
                num2 = Math.floor(Math.random() * maxNum) + minNum;
                currentOperator = '+';
                correctAnswer = num1 + num2;
            } 
            else if (op === 'sub') {
                num1 = Math.floor(Math.random() * maxNum) + minNum;
                num2 = Math.floor(Math.random() * num1) + 1; // Para evitar números negativos
                currentOperator = '−';
                correctAnswer = num1 - num2;
            } 
            else if (op === 'mul') {
                num1 = Math.floor(Math.random() * maxNum) + minNum;
                num2 = Math.floor(Math.random() * (level === 'easy' ? 5 : 10)) + 1;
                currentOperator = '×';
                correctAnswer = num1 * num2;
            } 
            else if (op === 'div') {
                // Generar división exacta
                num2 = Math.floor(Math.random() * (level === 'easy' ? 5 : 10)) + 1;
                correctAnswer = Math.floor(Math.random() * maxNum) + 1;
                num1 = num2 * correctAnswer; // Asegura división entera
                currentOperator = '÷';
            }

            // Renderizar en UI
            document.getElementById('num1').innerText = num1;
            document.getElementById('num2').innerText = num2;
            document.getElementById('operator-symbol').innerText = currentOperator;
        }

        // Temporizador por Pregunta
        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = selectedLevel === 'easy' ? 30 : (selectedLevel === 'medium' ? 20 : 15);
            document.getElementById('timer-display').innerText = `${timerSeconds}s`;

            timerInterval = setInterval(() => {
                timerSeconds--;
                document.getElementById('timer-display').innerText = `${timerSeconds}s`;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            if (isAnswerLocked) return;
            isAnswerLocked = true;
            playSound('wrong');
            
            streak = 0;
            updateStatsDisplay();

            document.getElementById('correct-answer-show').innerText = correctAnswer;
            document.getElementById('error-badge').classList.remove('hidden');
        }

        // Control del Teclado Numérico
        function pressNum(num) {
            if (isAnswerLocked) return;
            playSound('click');
            if (userInput.length < 4) { // Límite de dígitos
                userInput += num;
                updateInputDisplay();
            }
        }

        function deleteNum() {
            if (isAnswerLocked) return;
            playSound('click');
            userInput = userInput.slice(0, -1);
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const inputEl = document.getElementById('user-input-text');
            const cursorEl = document.getElementById('cursor');

            inputEl.innerText = userInput;
            if (userInput.length > 0) {
                cursorEl.classList.add('hidden');
            } else {
                cursorEl.classList.remove('hidden');
            }
        }

        // Soporte Teclado Físico
        function setupKeyboardListener() {
            window.addEventListener('keydown', (e) => {
                const gameScreen = document.getElementById('game-screen');
                if (gameScreen.classList.contains('hidden')) return;

                if (e.key >= '0' && e.key <= '9') {
                    pressNum(parseInt(e.key));
                } else if (e.key === 'Backspace') {
                    deleteNum();
                } else if (e.key === 'Enter') {
                    submitAnswer();
                }
            });
        }

        // Validación de Respuesta
        function submitAnswer() {
            if (isAnswerLocked || userInput === '') return;
            isAnswerLocked = true;
            clearInterval(timerInterval);

            const val = parseInt(userInput);

            if (val === correctAnswer) {
                // RESPUESTA CORRECTA
                playSound('correct');
                correctCount++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;

                // Cálculo de puntos con bonus por racha
                const points = 100 + (streak * 20);
                score += points;

                // Animación de Confeti ligero
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                // Mostrar badge de éxito
                const randomPraise = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
                document.getElementById('feedback-text').innerText = randomPraise;
                document.getElementById('feedback-badge').classList.remove('hidden');

                updateStatsDisplay();

                setTimeout(() => {
                    nextQuestion();
                }, 1200);

            } else {
                // RESPUESTA INCORRECTA
                playSound('wrong');
                streak = 0;
                updateStatsDisplay();

                // Animación de Shake en el contenedor de la pregunta
                const card = document.getElementById('problem-card');
                card.classList.add('custom-shake');
                setTimeout(() => card.classList.remove('custom-shake'), 500);

                document.getElementById('correct-answer-show').innerText = correctAnswer;
                document.getElementById('error-badge').classList.remove('hidden');
            }
        }

        function updateStatsDisplay() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('streak-display').innerText = streak;
        }

        // Pantalla de Resultados Finales
        function endGame() {
            clearInterval(timerInterval);
            playSound('win');

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            const accuracy = Math.round((correctCount / totalQuestions) * 100);

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            document.getElementById('final-streak').innerText = maxStreak;

            // Calcular Estrellas y Trofeo
            let starsHTML = '';
            let emoji = '🏆';
            let subtitle = '';

            if (accuracy >= 90) {
                starsHTML = `
                    <i class="fa-solid fa-star text-yellow-400 animate-bounce"></i>
                    <i class="fa-solid fa-star text-yellow-400 animate-bounce" style="animation-delay: 0.1s"></i>
                    <i class="fa-solid fa-star text-yellow-400 animate-bounce" style="animation-delay: 0.2s"></i>
                `;
                emoji = '👑';
                subtitle = '¡Puntaje Perfecto! Eres el Mago Supremo de las Matemáticas.';
            } else if (accuracy >= 60) {
                starsHTML = `
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-slate-300"></i>
                `;
                emoji = '🌟';
                subtitle = '¡Gran trabajo! Estás muy cerca de dominar este nivel.';
            } else {
                starsHTML = `
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <i class="fa-solid fa-star text-slate-300"></i>
                    <i class="fa-solid fa-star text-slate-300"></i>
                `;
                emoji = '👍';
                subtitle = '¡Buen intento! Sigue practicando para ganar más estrellas.';
            }

            document.getElementById('stars-container').innerHTML = starsHTML;
            document.getElementById('trophy-emoji').innerText = emoji;
            document.getElementById('results-subtitle').innerText = subtitle;

            // Lluvia final de confeti si la racha fue buena
            if (accuracy >= 70) {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
